[Settings]
extPlugin = qti

# Hanging up one call of a VoLTE conference (merged calls) ends the whole
# conference by default: Sailfish's call screen shows no participant list,
# and its "End call" hangs up a single call. To remove only that
# participant instead, use
#
#   extPlugin = qti:memberHangup=participant
#
# (parameters follow the plugin name after ':' as key=value, separated
# by ';'). Hanging up all members at once always ends the conference.
# Package updates replace this file: set it in a [Settings] group of a file
# that sorts after this one, e.g. /etc/ofono/binder.d/zz-local.conf.
